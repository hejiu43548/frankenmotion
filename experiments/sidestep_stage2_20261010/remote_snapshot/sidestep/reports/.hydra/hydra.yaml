hydra:
  run:
    dir: ${paths.report}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - stage=stage2
    - controller=with_root
    - experiment=single_sidestep
    - run_date=20261010
    - seed=20261010
    - initial=/mnt/sda2/frankenmotion/outputs_amass/shared20_walking_20261009/imported_root.pt
    - backbone.checkpoint=/home/psirobot/checkpoints/frankenmotion/frankenmotion.ckpt
    - data.train_manifest=/mnt/sda2/frankenmotion/outputs_amass/source_repair_sidestep_20261010_v2/train.json
    - data.val_manifest=/mnt/sda2/frankenmotion/outputs_amass/source_repair_sidestep_20261010_v2/val.json
    - data.path_root=/home/psirobot/projects/frankenmotion
    - data.skeleton=/home/psirobot/projects/frankenmotion/outputs_amass/transfer_charlie_20261008/snapshot/outputs_amass/franken_eleven_20261003/skeleton.npz
    - data.tasks=[sidestep]
    - stage.steps=10000
    - stage.batch_size=8
    - stage.eval_every=1000
    - validation.points=10
    - validation.ddim_steps=50
    - paths.report=/mnt/sda2/frankenmotion/outputs_amass/sidestep_stage2_20261010/sidestep/reports
    - paths.artifacts=/mnt/sda2/frankenmotion/outputs_amass/sidestep_stage2_20261010/sidestep/artifacts
  job:
    name: train
    chdir: false
    override_dirname: backbone.checkpoint=/home/psirobot/checkpoints/frankenmotion/frankenmotion.ckpt,controller=with_root,data.path_root=/home/psirobot/projects/frankenmotion,data.skeleton=/home/psirobot/projects/frankenmotion/outputs_amass/transfer_charlie_20261008/snapshot/outputs_amass/franken_eleven_20261003/skeleton.npz,data.tasks=[sidestep],data.train_manifest=/mnt/sda2/frankenmotion/outputs_amass/source_repair_sidestep_20261010_v2/train.json,data.val_manifest=/mnt/sda2/frankenmotion/outputs_amass/source_repair_sidestep_20261010_v2/val.json,experiment=single_sidestep,initial=/mnt/sda2/frankenmotion/outputs_amass/shared20_walking_20261009/imported_root.pt,paths.artifacts=/mnt/sda2/frankenmotion/outputs_amass/sidestep_stage2_20261010/sidestep/artifacts,paths.report=/mnt/sda2/frankenmotion/outputs_amass/sidestep_stage2_20261010/sidestep/reports,run_date=20261010,seed=20261010,stage.batch_size=8,stage.eval_every=1000,stage.steps=10000,stage=stage2,validation.ddim_steps=50,validation.points=10
    id: ???
    num: ???
    config_name: train
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /mnt/sda2/frankenmotion/code/shared20_walking_43bf05f
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /mnt/sda2/frankenmotion/code/shared20_walking_43bf05f/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /mnt/sda2/frankenmotion/outputs_amass/sidestep_stage2_20261010/sidestep/reports
    choices:
      stage: stage2
      loss: supervised
      data: amass20
      controller: with_root
      backbone: official
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
