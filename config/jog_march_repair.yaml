project: /home/psirobot/projects/frankenmotion
base: /mnt/sda2/frankenmotion/outputs_amass/source_repair_jump_20261010_v3
amass: /mnt/sda2/dataset/amass
babel: /mnt/sda2/dataset/babel
output: /mnt/sda2/frankenmotion/outputs_amass/source_repair_jog_march_20261010_v2
skeleton: ${project}/outputs_amass/transfer_charlie_20261008/snapshot/outputs_amass/franken_eleven_20261003/skeleton.npz
inspect_only: true
rules:
  minimum_frames: 40
  maximum_frames: 100
  smooth_frames: 7
  activity_clearance_m: 0.04
  jog_minimum_mean_speed_m_s: 0.65
  jog_minimum_forward_fraction: 0.80
  jog_maximum_lateral_fraction: 0.35
  jog_maximum_pause_fraction: 0.10
  march_maximum_mean_speed_m_s: 0.25
  march_maximum_excursion_m: 0.20
  march_maximum_net_displacement_m: 0.15
  maximum_backward_fraction: 0.05
  maximum_torso_tilt_rad: 0.65
  peak_prominence_m: 0.055
  peak_height_m: 0.07
  minimum_peaks_per_foot: 2
  minimum_alternation_fraction: 0.80
  maximum_simultaneous_peak_fraction: 0.25
  minimum_step_rate_hz: 2.0
  maximum_step_rate_hz: 5.0
  maximum_stride_interval_cv: 0.45
  maximum_step_gap_s: 0.75
  maximum_double_support_frames: 5
  flight_clearance_m: 0.02
  minimum_flight_fraction: 0.025
  minimum_flight_runs: 2
  support_clearance_m: 0.035
  maximum_support_vertical_speed_m_s: 0.30
  maximum_median_support_speed_m_s: 0.35
hydra:
  job:
    chdir: false
  run:
    dir: ${output}/hydra
